<section class="bg-background text-text">
  <div class="mx-auto grid w-full max-w-384 gap-6 px-4 py-8 sm:px-6 lg:grid-cols-[18rem_1fr] lg:px-10 lg:py-10 xl:px-12">
    <aside class="border border-primary/10 bg-primary text-background shadow-xl shadow-primary/15 lg:min-h-[calc(100vh-12rem)]">
      <div class="border-b border-background/10 p-6">
        <p class="text-[0.58rem] font-black uppercase tracking-[0.36em] text-accent">Damoor</p>
        <h1 class="mt-3 font-display text-3xl leading-none">Admin</h1>
        <p class="mt-3 text-sm leading-6 text-background/65">
          Live operations for the Damoor store.
        </p>
      </div>

      <nav class="p-3" aria-label="Admin navigation">
        @for (link of navLinks; track link.route) {
          <a
            [routerLink]="link.route"
            routerLinkActive="border-accent bg-background/8 text-accent"
            class="group block border border-transparent px-4 py-4 text-background/78 transition hover:border-background/15 hover:bg-background/5 hover:text-background"
          >
            <span class="text-xs font-bold uppercase tracking-[0.24em]">{{ link.label }}</span>
            <span class="mt-2 block text-xs leading-5 text-background/48 group-hover:text-background/65">
              {{ link.description }}
            </span>
          </a>
        }
      </nav>
    </aside>

    <main class="min-w-0">
      <router-outlet />
    </main>
  </div>
</section>
